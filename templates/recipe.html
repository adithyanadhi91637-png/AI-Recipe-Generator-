<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ recipe.recipe }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        /* Navbar */

        nav{
            background:#2e7d32;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 60px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        nav h2{
            font-size:28px;
        }

        nav a{
            color:white;
            text-decoration:none;
            background:#43a047;
            padding:10px 20px;
            border-radius:8px;
            transition:.3s;
        }

        nav a:hover{
            background:#1b5e20;
        }

        /* Card */

        .container{

            width:90%;
            max-width:950px;

            margin:40px auto;

            background:white;

            border-radius:18px;

            overflow:hidden;

            box-shadow:0 15px 35px rgba(0,0,0,.15);

        }

        .recipe-image{

            width:100%;
            height:450px;
            object-fit:cover;

        }

        .content{

            padding:35px;

        }

        h1{

            color:#2e7d32;
            font-size:40px;
            margin-bottom:15px;

        }

        .info{

            display:flex;
            gap:15px;
            flex-wrap:wrap;
            margin-bottom:30px;

        }

        .badge{

            background:#e8f5e9;

            color:#2e7d32;

            padding:10px 18px;

            border-radius:25px;

            font-weight:600;

        }

        h2{

            margin-top:30px;
            margin-bottom:12px;
            color:#2e7d32;

        }

        .box{

            background:#f8f9fa;

            border-left:6px solid #2e7d32;

            padding:18px;

            border-radius:10px;

            line-height:1.8;

            color:#444;

            white-space:pre-line;

        }

        .back-btn{

            display:inline-block;

            margin-top:35px;

            background:#2e7d32;

            color:white;

            text-decoration:none;

            padding:12px 28px;

            border-radius:8px;

            font-weight:600;

            transition:.3s;

        }

        .back-btn:hover{

            background:#1b5e20;

        }

        footer{

            text-align:center;

            margin:40px;

            color:#666;

        }

    </style>

</head>

<body>

<nav>

    <h2>🍽 CookSmart AI</h2>

    <a href="/">🏠 Home</a>

</nav>

<div class="container">

    <img class="recipe-image"
         src="{{ url_for('static', filename='images/' + recipe.image) }}"
         alt="{{ recipe.recipe }}">

    <div class="content">

        <h1>{{ recipe.recipe }}</h1>

        <div class="info">

            <div class="badge">⏱ {{ recipe.time }}</div>

            <div class="badge">⭐ {{ recipe.difficulty }}</div>

        </div>

        <h2>📝 Description</h2>

        <div class="box">

            {{ recipe.description }}

        </div>

        <h2>🥕 Ingredients</h2>

        <div class="box">

            {{ recipe.ingredients }}

        </div>

        <h2>👨‍🍳 Cooking Instructions</h2>

        <div class="box">

            {{ recipe.instructions }}

        </div>

        <a href="/" class="back-btn">

            ← Back to Home

        </a>

    </div>

</div>

<footer>

    © 2026 CookSmart AI • AI Recipe Recommendation System

</footer>

</body>

</html>
